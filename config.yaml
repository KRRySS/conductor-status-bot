# Native MCP launch config for the bundled read-only Conductor status server.
#
# This file is PRESERVED by `hermes profile update` (it holds your model/provider settings), so
# it must contain nothing that a release would need to change. It only points at launch.py,
# a stdlib-only launcher that is distribution-owned and overwritten on every update; launch.py
# decides where the profile is, which lockfile applies and how to start the server.
#
# ${userHome} is a context variable Hermes resolves to the real user home. Do NOT use
# ${HERMES_HOME}: Hermes interpolates it from the launch profile's environment (under the desktop
# app / multiplexing that is ~/.hermes, not this profile). If you installed with --name <other>,
# the installer cannot rewrite this file for you — run the doctor, it prints the exact commands:
#   python3 <profile>/skills/conductor-status/scripts/doctor.py
# First place to look when the tool is missing: <profile>/logs/mcp-stderr.log
mcp_servers:
  conductor_status:
    command: python3
    args:
      - ${userHome}/.hermes/profiles/conductor-status-bot/skills/conductor-status/scripts/launch.py
    connect_timeout: 120
    timeout: 120
    sampling:
      enabled: false
